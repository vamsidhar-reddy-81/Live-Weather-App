<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Live Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="weather-container">

        <h1>🌦️ Live Weather</h1>

        <p class="subtitle">Check the weather in your city</p>

        <div class="search-box">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
            >

            <button id="searchBtn">Search</button>
        </div>

        <p id="message"></p>

        <div class="weather-card" id="weatherCard">

            <h2 id="cityName">Hyderabad</h2>

            <div class="weather-icon" id="weatherIcon">🌤️</div>

            <h1 id="temperature">--°C</h1>

            <p id="description">Search for a city</p>

            <div class="weather-details">

                <div class="detail">
                    <span>💧</span>
                    <p>Humidity</p>
                    <h3 id="humidity">--%</h3>
                </div>

                <div class="detail">
                    <span>💨</span>
                    <p>Wind Speed</p>
                    <h3 id="windSpeed">-- km/h</h3>
                </div>

            </div>

        </div>

        <button id="refreshBtn" class="refresh-btn">
            Refresh Weather
        </button>

        <p class="footer">Weather data powered by Open-Meteo</p>

    </div>

    <script src="script.js"></script>

</body>

</html>
